<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 400" font-family="Malgun Gothic, Apple SD Gothic Neo, sans-serif">
  <rect width="720" height="400" fill="#ffffff"/>

  <!-- A/V ratio -->
  <text x="180" y="40" text-anchor="middle" font-size="17" font-weight="bold" fill="#0e7c86">A/V ratio (동맥/정맥 굵기비)</text>

  <g>
    <text x="30" y="96" font-size="14" font-weight="bold" fill="#22303f">정상 ≈ 2:3</text>
    <path d="M150 88 H330" stroke="#b5453f" stroke-width="8" stroke-linecap="round"/>
    <path d="M150 88 H330" stroke="#e0a0a0" stroke-width="1.6" opacity="0.8"/>
    <path d="M150 122 H330" stroke="#6a3d8f" stroke-width="12" stroke-linecap="round"/>
    <path d="M150 122 H330" stroke="#b79ad0" stroke-width="2" opacity="0.8"/>
    <text x="340" y="92" font-size="12.5" fill="#b5453f">동맥</text>
    <text x="340" y="126" font-size="12.5" fill="#6a3d8f">정맥</text>
  </g>
  <g>
    <text x="30" y="196" font-size="14" font-weight="bold" fill="#c62828">동맥협착 ≤ 1:2</text>
    <path d="M150 188 H330" stroke="#b5453f" stroke-width="5" stroke-linecap="round"/>
    <path d="M150 222 H330" stroke="#6a3d8f" stroke-width="12" stroke-linecap="round"/>
    <text x="340" y="192" font-size="12.5" fill="#b5453f">동맥↓</text>
    <text x="340" y="226" font-size="12.5" fill="#6a3d8f">정맥</text>
  </g>
  <text x="180" y="286" text-anchor="middle" font-size="12.5" fill="#5b6b82">정상 ≈ 0.66 · 0.5 이하 = 동맥협착</text>
  <text x="180" y="308" text-anchor="middle" font-size="12.5" fill="#5b6b82">고혈압·동맥경화에서 감소</text>
  <text x="180" y="342" text-anchor="middle" font-size="13" font-weight="bold" fill="#22303f">먼저 의심 → 고혈압망막병증</text>

  <line x1="380" y1="20" x2="380" y2="380" stroke="#e2e8f0"/>

  <!-- AV crossing -->
  <text x="550" y="40" text-anchor="middle" font-size="17" font-weight="bold" fill="#0e7c86">AV crossing (동정맥 교차)</text>

  <g>
    <text x="410" y="96" font-size="14" font-weight="bold" fill="#0e7c86">정상</text>
    <path d="M410 150 H690" stroke="#6a3d8f" stroke-width="13" stroke-linecap="round"/>
    <path d="M550 96 V220" stroke="#b5453f" stroke-width="10" stroke-linecap="round"/>
    <text x="550" y="240" text-anchor="middle" font-size="12" fill="#5b6b82">정맥이 부드럽게 통과</text>
  </g>
  <g>
    <text x="410" y="300" font-size="14" font-weight="bold" fill="#c62828">AV nicking (교차변화)</text>
    <path d="M410 360 H510" stroke="#6a3d8f" stroke-width="13" stroke-linecap="round"/>
    <path d="M530 360 H690" stroke="#6a3d8f" stroke-width="6" stroke-linecap="round"/>
    <path d="M520 300 V420" stroke="#b5453f" stroke-width="10" stroke-linecap="round"/>
    <path d="M510 360 q20 -8 20 0 q0 8 20 0" fill="none" stroke="#c62828" stroke-width="2"/>
    <text x="600" y="384" text-anchor="middle" font-size="12" fill="#c62828">교차부에서 정맥이 잘록</text>
  </g>
</svg>
